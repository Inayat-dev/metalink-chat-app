<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        
    </style>
    <link rel="stylesheet" href="Astyle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-toggle">
                <button id="login-btn" class="active">Login</button>
                <button id="register-btn">Register</button>
            </div>
            
            <div class="form-content">
                <form id="login-form" action="login.php" method="post" class="form active">
                    <h2>Welcome Back!</h2>
                    <div class="input-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" placeholder="Enter your username" name="username" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn" >Login</button>
                    <p class="toggle-text">Don't have an account? <a href="#" id="switch-to-register">Register here</a></p>
                </form>

                <form id="register-form" action="register.php" method="post" class="form">
                    <h2>Create an Account</h2>
                    <div class="input-group">
                        <label for="register-username">Username</label>
                        <input type="text" name="username" id="register-username" oninput="check(this)" placeholder="Choose a username" required>
                        <span id="suggestion"></span>
                    </div>
                    <div class="input-group">
                        <label for="register-email">Email</label>
                        <input type="email" name="email" id="register-email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="register-bio">Bio</label>
                        <input type="text" name="bio" oninput="bio_check(this)" id="register-bio" placeholder="Enter your bio" required>
                        <span id="bio_suggestion"></span>
                    </div>
                    <div class="input-group">
                        <label for="register-password">Password</label>
                        <input type="password" name="password" id="register-password" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="btn"  name="submit">Register</button>
                    <p class="toggle-text">Already have an account? <a href="#" id="switch-to-login">Login here</a></p>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Check if the URL has the error parameter
        let register = true;
        const params = new URLSearchParams(window.location.search);
        if (params.has('error') && params.get('error') === 'username_exists') {
            // Show SweetAlert2 error notification if 'username_exists' is found
            Swal.fire({
                icon: 'error',
                title: 'Username Taken',
                text: 'Username is already taken. Please choose another one.',
                confirmButtonColor: '#3085d6',
                timer: 1500,  // Automatically close after 3 seconds
                timerProgressBar: true
            });
        }

        async function check(input){
            let username = input.value;
            let suggestion = document.getElementById('suggestion');
            const res = await fetch('check_username.php?username='+username);
            const data = await res.json()
            console.log(data.username) 
            if(data.username == 'done'){
                suggestion.innerHTML = "username <b>"+username+"</b> is available"
                suggestion.style.color = "green"
            }else if(username == ''){
                suggestion.innerHTML="";
                register = false
            }
            else{
                suggestion.innerHTML = "username <b>"+username+"</b> is already exist"  
                suggestion.style.color = "red"  
                register = false     
            }
        }

        function bio_check(input){
            let value = input.value;
            let bio_suggestion = document.getElementById('bio_suggestion')
            if(special(value)){
                bio_suggestion.innerHTML = "remove ' or \" from bio"
                bio_suggestion.style.color = "red";
                register = false
            }else if(value == ""){
                bio_suggestion.innerHTML = ""
                bio_suggestion.style.color = "green";
            }
            
            else{
                bio_suggestion.innerHTML = value+" is valid bio"
                bio_suggestion.style.color = "green";
            }
        }

        function special(value){
            let length = value.length;
            for(let i=0;i<length;i++){
                if(value[i] == "'" || value[i] == '"'){
                    return true
                }
            }
            return false;
        }

        if (params.has('error') && params.get('error') === 'invalid') {
            // Show SweetAlert2 error notification if 'username_exists' is found
            Swal.fire({
                icon: 'error',
                title: 'Username Taken',
                text: 'Wrong Detail Try again',
                confirmButtonColor: '#3085d6',
                timer: 1500,  // Automatically close after 3 seconds
                timerProgressBar: true
            });
        }
    </script>
    <script>
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        

        loginBtn.addEventListener('click', () => {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            loginBtn.classList.add('active');
            registerBtn.classList.remove('active');
        });

        registerBtn.addEventListener('click', () => {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            registerBtn.classList.add('active');
            loginBtn.classList.remove('active');
        });

        document.getElementById('switch-to-register').addEventListener('click', (e) => {
            e.preventDefault();
            registerBtn.click();
        });

        document.getElementById('switch-to-login').addEventListener('click', (e) => {
            e.preventDefault();
            loginBtn.click();
        });
    </script>
</body>
</html>
